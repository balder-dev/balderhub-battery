[metadata]
name = balderhub-battery
description = balderhub-battery: BalderHub Project for interacting with Batteries and testing devices that use Batteries
author = Max Stahlschmidt
long_description = file: README.md
long_description_content_type = text/markdown
url = https://hub.balder.dev/projects/battery
license = MIT
license_files = LICENSE
platforms = unix, linux, osx, cygwin, win32
keywords = test, systemtest, reusable, scenario, junit, balder
classifiers =
    License :: OSI Approved :: MIT License
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Software Development :: Libraries
    Topic :: Software Development :: Testing
    Topic :: Utilities
project_urls =
    Source=https://github.com/balder-dev/balderhub-battery/
    Tracker=https://github.com/balder-dev/balderhub-battery/issues

[options]
packages =
    balderhub.battery
    balderhub.battery.lib
    balderhub.battery.lib.scenario_features
    balderhub.battery.lib.setup_features
    balderhub.battery.lib.utils
    balderhub.battery.lib.utils.battery_discharge_characteristic
    balderhub.battery.scenarios

install_requires =
    baldertest
    balderhub-powersupply
python_requires = >=3.9
package_dir =
    =src
setup_requires =
    setuptools
    setuptools-scm>=6.0
zip_safe = no
